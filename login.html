<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to GoodReads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }
        .input-field:focus {
            border-color: #58a6ff;
            outline: none;
            box-shadow: inset 0 0 0 1px transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <div class="mt-8 pt-8 pb-4 flex flex-col items-center w-full">
        <svg height="48" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="48" data-view-component="true" class="fill-white mb-6">
            <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
        </svg>
        <h1 class="text-[24px] font-light tracking-tight text-[#c9d1d9]">Sign in to GoodReads</h1>
    </div>

    <div class="w-full max-w-[340px] px-4 sm:px-0 mt-2">
        <div class="bg-[#161b22] border border-[#30363d] rounded-md p-4">
            <form>
                <div class="mb-4">
                    <label for="email" class="block mb-2 text-sm font-normal text-[#c9d1d9]">email address</label>
                    <input type="text" id="email" class="input-field w-full bg-[#0d1117] border border-[#30363d] rounded-md px-3 py-[5px] text-sm text-white h-8 transition-colors" />
                </div>
                
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-sm font-normal text-[#c9d1d9]">Password</label>
                        <a href="#" class="text-xs text-[#2f81f7] hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="input-field w-full bg-[#0d1117] border border-[#30363d] rounded-md px-3 py-[5px] text-sm text-white h-8 transition-colors" />
                </div>

                <div>
                    <a type="submit" class="w-full bg-[#238636] hover:bg-[#2ea043] text-white font-medium text-sm py-[5px] px-4 rounded-md border border-[rgba(240,246,252,0.1)] transition-colors h-[32px] mt-1" href="./dashboard.html" style="width: 100%;display: flex;justify-content: center;">
                        Sign in
                    </a>
                </div>
            </form>
            
            <div class="mt-4 mb-4 flex items-center justify-center relative">
                <hr class="w-full border-t border-[#30363d]">
                <span class="absolute bg-[#161b22] px-3 text-xs text-[#8b949e]">or</span>
            </div>

            <button class="w-full bg-[#21262d] hover:bg-[#30363d] text-[#c9d1d9] font-medium text-sm py-[5px] px-4 rounded-md border border-[#30363d] transition-colors flex items-center justify-center h-[32px]">
                <svg class="w-4 h-4 mr-2" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                Continue with Google
            </button>
        </div>

        <div class="mt-4 text-center">
            <p class="text-sm text-[#8b949e]">
                New to GoodReads? 
                <a href="./signup.html" class="text-[#2f81f7] hover:underline">Create an account</a>
            </p>
        </div>
    </div>

    <div class="mt-auto pt-16 pb-12 w-full flex justify-center">
        <ul class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-xs text-[#8b949e] px-4">
            <li><a href="#" class="hover:text-[#2f81f7] hover:underline">Terms</a></li>
            <li><a href="#" class="hover:text-[#2f81f7] hover:underline">Privacy</a></li>
            <li><a href="#" class="hover:text-[#2f81f7] hover:underline">Docs</a></li>
            <li><a href="#" class="hover:text-[#2f81f7] hover:underline">Contact GitHub Support</a></li>
            <li><a href="#" class="hover:text-[#2f81f7] hover:underline">Manage cookies</a></li>
            <li><a href="#" class="hover:text-[#2f81f7] hover:underline">Do not share my personal information</a></li>
        </ul>
    </div>

</body>
</html>
