</head>
<body class="bg-ghBg text-ghText font-sans min-h-screen flex flex-col">

    <header class="bg-ghHeader border-b border-ghBorder pt-3 sticky top-0 z-20">

                </a>

            </div>

        <div class="px-4 flex gap-6 text-ghMuted text-sm overflow-x-auto whitespace-nowrap">

                Overview

                <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"></path></svg>
                Categories
                <span class="bg-ghButton text-white rounded-full px-2 py-0.5 text-xs font-semibold">12</span>
            </a>
            <a href="./your-activity.html" class="flex items-center gap-2 pb-3 hover:text-white hover:border-b-2 hover:border-ghBorder border-b-2 border-transparent transition-colors">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path fill-rule="evenodd" d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0114.25 15H1.75A1.75 1.75 0 010 13.25V2.75zm1.75-.25a.25.25 0 00-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 00.25-.25V2.75a.25.25 0 00-.25-.25H1.75zM4.5 4A.75.75 0 003.75 4.75v3.5a.75.75 0 001.5 0v-3.5A.75.75 0 004.5 4zm4 0a.75.75 0 00-.75.75v5.5a.75.75 0 001.5 0v-5.5A.75.75 0 008.5 4zm4 0a.75.75 0 00-.75.75v2a.75.75 0 001.5 0v-2A.75.75 0 0012.5 4z"></path></svg>

    <main class="flex-1 flex flex-col lg:flex-row w-full max-w-[1600px] mx-auto p-4 gap-4">
        <aside class="w-full lg:w-72 flex-shrink-0 flex flex-col bg-ghBg border border-ghBorder rounded-md overflow-hidden h-[400px] lg:h-[calc(100vh-140px)]">
            <div class="p-3 border-b border-ghBorder flex items-center justify-between bg-ghBg">
                <div class="flex items-center gap-2 font-medium text-sm text-white">
                    Files
                </div>
            </div>
            
            <div class="p-3 pb-2 border-b border-ghBorder flex gap-2">
                <button id="addFileBtn" class="w-full bg-ghButton hover:bg-ghButtonHover border border-ghBorder rounded-md p-1.5 flex justify-center items-center gap-2 text-ghMuted transition-colors">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M7.75 2a.75.75 0 01.75.75V7h4.25a.75.75 0 110 1.5H8.5v4.25a.75.75 0 11-1.5 0V8.5H2.75a.75.75 0 010-1.5H7V2.75A.75.75 0 017.75 2z"></path></svg>
                    Add File 
                </button>
            </div>

            <div class="px-3 py-2 border-b border-ghBorder">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none text-ghMuted">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M11.5 7a4.499 4.499 0 11-8.998 0A4.499 4.499 0 0111.5 7zm-.82 4.74a6 6 0 111.06-1.06l3.04 3.04a.75.75 0 11-1.06 1.06l-3.04-3.04z"></path></svg>
                    </div>
                    <input type="text" class="w-full bg-[#010409] border border-ghBorder rounded-md py-1.5 pl-8 pr-8 text-sm focus:outline-none focus:border-blue-500 placeholder-ghMuted" placeholder="Go to file">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto py-2 text-sm">
                <div class="flex items-center gap-2 px-3 py-1.5 hover:bg-ghButton cursor-pointer text-ghText pl-[26px]">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="text-ghMuted"><path fill-rule="evenodd" d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0113.25 16h-9.5A1.75 1.75 0 012 14.25V1.75zm1.75-.25a.25.25 0 00-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 00.25-.25V6h-2.75A1.75 1.75 0 019 4.25V1.5H3.75zm6.75.062V4.25c0 .138.112.25.25.25h2.688a.252.252 0 00-.011-.013l-2.914-2.914a.272.272 0 00-.013-.011z"></path></svg>
                    <span class="truncate">12-Aug-26 Logs</span>
                </div>
                <div class="flex items-center gap-2 px-3 py-1.5 hover:bg-ghButton cursor-pointer text-ghText pl-[26px] bg-ghHighlight border-l-2 border-blue-500">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="text-ghMuted"><path fill-rule="evenodd" d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0113.25 16h-9.5A1.75 1.75 0 012 14.25V1.75zm1.75-.25a.25.25 0 00-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 00.25-.25V6h-2.75A1.75 1.75 0 019 4.25V1.5H3.75zm6.75.062V4.25c0 .138.112.25.25.25h2.688a.252.252 0 00-.011-.013l-2.914-2.914a.272.272 0 00-.013-.011z"></path></svg>
                    <span class="truncate">13-Aug-26 Logs</span>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col bg-ghBg border border-ghBorder rounded-md overflow-hidden h-[500px] lg:h-[calc(100vh-140px)] min-w-0">
            <div class="px-4 py-3 border-b border-ghBorder flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-ghBg">
                <div class="flex items-center text-sm overflow-x-auto whitespace-nowrap w-full sm:w-auto text-ghBlue">
                    <a href="./categories.html" class="font-semibold cursor-pointer hover:underline">Categories</a>
                    <span class="mx-1 text-ghMuted font-normal">/</span>
                    <a href="./category-details.html" class="cursor-pointer hover:underline">Atomic Habits</a>
                    
                    <span class="mx-1 text-ghMuted font-normal">/</span>
                    <div class="relative ml-1">
                        <input type="text" class="bg-[#010409] border border-blue-500 rounded px-2 py-0.5 text-white w-28 focus:outline-none focus:ring-1 focus:ring-blue-500 font-semibold" value="13-Aug-26 Logs">
                    </div>
                </div>
                <div class="flex gap-2 flex-shrink-0 w-full sm:w-auto justify-end">
                    <button class="bg-ghButton hover:bg-ghButtonHover border border-ghBorder text-white text-sm font-medium py-1.5 px-3 rounded-md transition-colors">
                        Cancel changes
                    </button>
                    <button class="bg-ghGreen hover:bg-ghGreenHover text-white text-sm font-medium py-1.5 px-3 rounded-md border border-white/10 transition-colors shadow-sm">
                        Save changes...
                    </button>
                </div>
            </div>

            <div class="bg-[#0d1117] px-4 py-2 flex justify-between items-center text-sm border-b border-ghBorder">
                <div class="flex gap-1 border border-ghBorder rounded-md p-1">
                    <button class="px-3 py-1.5 bg-ghButton border border-ghBorder rounded-md text-white font-medium flex items-center gap-2 shadow-sm">
                        Edit
                    </button>
                    <button class="px-3 py-1.5 text-ghMuted hover:text-white rounded-md font-medium transition-colors">
                        Preview
                    </button>
                </div>
                
                <div class="flex items-center gap-2 text-ghMuted">
                    <button class="flex items-center gap-1.5 px-2 py-1 hover:text-white rounded transition-colors border border-ghBorder shadow-sm">
                        Spaces
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4.427 7.427l3.25 3.25a.25.25 0 00.354 0l3.25-3.25a.25.25 0 00-.177-.427H4.604a.25.25 0 00-.177.427z"></path></svg>
                    </button>
                    <button class="flex items-center gap-1.5 px-2 py-1 hover:text-white rounded transition-colors border border-ghBorder shadow-sm">
                        2
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4.427 7.427l3.25 3.25a.25.25 0 00.354 0l3.25-3.25a.25.25 0 00-.177-.427H4.604a.25.25 0 00-.177.427z"></path></svg>
                    </button>
                    <button class="flex items-center gap-1.5 px-2 py-1 hover:text-white rounded transition-colors border border-ghBorder shadow-sm">
                        No wrap
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4.427 7.427l3.25 3.25a.25.25 0 00.354 0l3.25-3.25a.25.25 0 00-.177-.427H4.604a.25.25 0 00-.177.427z"></path></svg>
                    </button>
                </div>
            </div>

            <div class="flex-1 bg-[#0d1117] overflow-auto font-mono text-sm leading-relaxed py-4">
                <div class="flex group hover:bg-[#161b22] px-2 transition-colors">
                    <div class="w-10 text-right pr-4 text-[#6e7681] select-none">1</div>
                    <div class="text-[#8b949e] whitespace-pre"># Simple workflow for deploying static content to GitHub Pages</div>
                </div>
                <div class="flex group hover:bg-[#161b22] px-2 transition-colors mt-0.5">
                    <div class="w-10 text-right pr-4 text-[#6e7681] select-none">2</div>
                    <div class="whitespace-pre"><span class="text-[#79c0ff]">name:</span> <span class="underline decoration-red-500 decoration-wavy decoration-1 underline-offset-4">Deploy static content to Pages</span></div>
                </div>
            </div>

        </div>
    </main>

    <div id="fileModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm px-4">
        <div class="bg-ghBg border border-ghBorder rounded-xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col transform transition-all">
            
            <div class="px-4 py-3 border-b border-ghBorder flex justify-between items-center bg-ghHeader">
                <h3 class="text-white font-semibold text-sm">Create a new file</h3>
                <button id="closeModalBtn" class="text-ghMuted hover:text-white transition-colors focus:outline-none">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path fill-rule="evenodd" d="M3.72 3.72a.75.75 0 011.06 0L8 6.94l3.22-3.22a.75.75 0 111.06 1.06L9.06 8l3.22 3.22a.75.75 0 11-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 01-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 010-1.06z"></path></svg>
                </button>
            </div>
            
            <div class="p-5 flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-white mb-2" for="fileName">
                        File name <span class="text-red-400">*</span>
                    </label>
                    <input type="text" id="fileName" class="w-full bg-ghHeader border border-ghBorder rounded-md px-3 py-1.5 text-sm text-ghText focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="e.g., 14-Aug-26 Logs">
                </div>
            </div>
            
            <div class="px-5 py-3 border-t border-ghBorder flex justify-end gap-2 bg-ghHeader">
                <button id="cancelModalBtn" class="bg-ghButton hover:bg-ghButtonHover border border-ghBorder text-white text-sm font-semibold rounded-md px-4 py-1.5 transition-colors shadow-sm">
                    Cancel
                </button>
                <button id="submitFileBtn" class="bg-ghGreen hover:bg-ghGreenHover text-white text-sm font-semibold rounded-md px-4 py-1.5 transition-colors shadow-sm">
                    Create file
                </button>
            </div>
            
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addFileBtn = document.getElementById('addFileBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const cancelModalBtn = document.getElementById('cancelModalBtn');
            const fileModal = document.getElementById('fileModal');
            const fileNameInput = document.getElementById('fileName');

            const openModal = () => {
                fileModal.classList.remove('hidden');
                fileNameInput.focus(); 
            };

            const closeModal = () => {
                fileModal.classList.add('hidden');
                fileNameInput.value = ''; 
            };

            addFileBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            cancelModalBtn.addEventListener('click', closeModal);

            fileModal.addEventListener('click', (e) => {
                if (e.target === fileModal) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !fileModal.classList.contains('hidden')) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
